[workspace]
resolver = "3"


[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Kirky-X/alchemize"
homepage = "https://github.com/Kirky-X/alchemize"
documentation = "https://docs.rs/alchemize"
rust-version = "1.97.1"

[package]
name = "alchemize"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
description = "Transmute any document into Markdown"
readme = "README.md"
keywords = ["markdown", "converter", "document", "pdf", "docx"]
categories = ["command-line-utilities", "text-processing"]
autobins = false

[lib]
name = "alchemize"
path = "src/lib.rs"

[[bin]]
name = "alch"
path = "src/main.rs"

[[bench]]
name = "bench_real"
harness = false

[[bin]]
name = "alch-mcp"
path = "src/bin/alch_mcp.rs"
required-features = ["mcp"]

[features]
# sdforge 宏生成的 CLI 注册项带 #[cfg(feature = "cli")]，按调用方 crate 解析——
# 本仓必须开启同名 feature，否则 alch 命令树为空（forms/doctor/convert 不可达）
default = ["cli"]
cli = []
# MinerU 云端 PDF 高保真（HTTP 客户端）
mineru = ["dep:reqwest", "dep:limiteron", "dep:futures", "reqwest/multipart", "reqwest/stream"]
# ASR：自研 vecboost transcribe 门面（Qwen3-ASR ONNX + silero VAD）
asr = ["dep:vecboost", "dep:reqwest", "reqwest/multipart"]
# pdfium 本地高保真 PDF 引擎（动态库运行时加载）。图片提取走 lopdf 结构
# 遍历（pdfium-render 0.5.9 安全层不暴露图片对象句柄）；image 用于样本→PNG
# 重编码——image 已在依赖树内（pdfium-render 传递引用），零新增外部代码。
# lopdf 为无条件依赖（兜底档文本抽取 + 结构遍历共用），不在此声明。
pdfium = ["dep:pdfium-render", "dep:image"]
# LibreOffice headless 旧格式引擎（外部 soffice 二进制）
libreoffice = []
# 归档容器族（tar/tgz/gz/xz/zst/7z）
containers = ["dep:tar", "dep:flate2", "dep:xz2", "dep:zstd", "dep:sevenz-rust2"]
# 结构化数据引擎（parquet/sqlite/bib）
data = ["dep:parquet", "dep:rusqlite", "dep:biblatex"]
# 邮件（eml）
eml = ["dep:mail-parser"]
# MCP 工具面：sdforge rmcp stdio 服务（alch-mcp）；CLI 封装（cli feature）恒在
mcp = ["sdforge/mcp"]
# html-deep 自研引擎：迭代状态机主链 + dom_smoothie 主内容提取 + htmd 兜底；
# icu_properties（Unicode P/S 分类，已在依赖树内）
html-deep = ["dep:scraper", "dep:dom_smoothie", "dep:ego_tree", "dep:regex", "dep:url", "dep:icu_properties"]
full = ["mineru", "asr", "html-deep", "containers", "data", "eml", "libreoffice", "pdfium"]

[dependencies]
anyhow = { version = "1.0", default-features = false, features = ["std"] }
async-trait = { version = "0.1", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["std"] }
bytes = { version = "1.0", default-features = false, features = ["std"] }

# 文档解析
csv = { version = "1.4", default-features = false }
encoding_rs = { version = "0.8", default-features = false }
htmd = { version = "0.5", default-features = false }
aspasia = { version = "0.2", default-features = false }
# lopdf（crates.io 直连 0.47）：兜底档文本抽取（extract_text_chunks，每页
# 有界）与 pdf_images 结构遍历共用；解压上限由调用点显式设限
# （LoadOptions / decompressed_content_with_limit），见
# specmark/changes/retire-lopdf-fork（归档后并入主 specs）
lopdf = { version = "0.47", default-features = false }
quick-xml = { version = "0.42", default-features = false, features = ["serialize"] }
rbook = { version = "0.7", default-features = false, features = ["threadsafe"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false }
thiserror = { version = "2.0", default-features = false }
tempfile = { version = "3", default-features = false, features = ["getrandom"] }
tokio = { version = "1.0", default-features = false, features = ["rt", "rt-multi-thread", "macros", "fs", "process", "io-util", "time", "sync"] }
tracing = { version = "0.1", default-features = false }
# CLI 日志前端：全仓 tracing 埋点（warn/debug/info）的消费者。默认不装配
# （ALCHEMIZE_LOG 未设/off 时零开销，stdout/stderr 形态与 cli-output spec
# 钉死的契约逐字节一致）；设级后全部级别强制走 stderr，stdout 管道纯净性
# 不破。default-features = false 裁掉 i18n/cache（oxcache）依赖树。
inklog = { version = "0.3.0-rc.12", default-features = false }
zip = { version = "9.3", default-features = false, features = ["deflate"] }

# CLI/MCP 封装框架：#[forge] 端点 → CliBuilder + rmcp stdio（MSRV 1.97.1 的来源）
sdforge = { version = "0.5.0-rc.10", features = ["cli"] }

# 可选后端
scraper = { version = "0.29", default-features = false, features = ["errors", "main"], optional = true }
# ego-tree 版本须与 scraper 0.29 内部依赖一致（NodeId 类型同一性，crawlrs 同款约束）
ego_tree = { package = "ego-tree", version = "0.11", default-features = false, optional = true }
dom_smoothie = { version = "0.19", default-features = false, optional = true }
# html-deep 链接绝对化预处理
regex = { version = "1.13", default-features = false, features = ["std", "perf", "unicode"], optional = true }
url = { version = "2", default-features = false, features = ["std"], optional = true }
futures = { version = "0.3", default-features = false, features = ["std"], optional = true }
# pdfium（Chrome PDF 引擎）绑定：运行时动态库加载，缺失降级
pdfium-render = { version = "0.5", default-features = false, optional = true }
# PDF 图片提取（feature pdfium）：结构遍历复用上方无条件 lopdf（crates.io
# 直连 0.47）；样本→PNG 重编码用 image（pdfium-render 已传递引用，
# 仅补显式声明）
image = { version = "0.23", default-features = false, features = ["png", "jpeg"], optional = true }
# Unicode 属性数据库（feature html-deep）：行内样式"词后标点"决策需精确
# P/S 分类（CommonMark 口径）；已在依赖树内，仅补显式声明
icu_properties = { version = "2.3", default-features = false, features = ["compiled_data"], optional = true }
# 轮询退避原语：MinerU 三客户端共享 poll_delay 走 limiteron delay_for_attempt
limiteron = { version = "0.3.0-rc.10", default-features = false, features = ["retry"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
# 自研转录引擎门面：Qwen3-ASR ONNX 三图 + silero VAD（load-dynamic ort）。
# path 依赖是刻意的 monorepo 布局：编译 asr feature 要求同级存在 ../vecboost。
# 代价：cargo publish 会因 path 依赖被拒——发布前须切换为 registry 依赖
# 或把 vecboost 并入本工作区。
vecboost = { path = "../vecboost", version = "0.3.0-rc.3", default-features = false, features = ["transcribe"], optional = true }

# 归档容器族（feature containers）
tar = { version = "0.4", default-features = false, optional = true }
flate2 = { version = "1", default-features = false, optional = true }
xz2 = { version = "0.1", default-features = false, optional = true }
zstd = { version = "0.13", default-features = false, optional = true }
# compress: writer needed by tests to build fixtures; LZMA2 decode is ungated
sevenz-rust2 = { version = "0.25", default-features = false, features = [
    "compress",
], optional = true }

# 结构化数据（feature data）
parquet = { version = "60", default-features = false, features = ["arrow", "snap", "lz4", "zstd", "flate2-rust_backend", "brotli"], optional = true }
rusqlite = { version = "0.39", default-features = false, features = ["bundled"], optional = true }
biblatex = { version = "0.12", default-features = false, optional = true }

# 邮件（feature eml）：mail-parser 是活跃维护的 MIME 解析器（mail crate 的
# mail-internals 带 RUSTSEC-2023-0054 UAF 且无修复版本）
mail-parser = { version = "1.0", default-features = false, optional = true }

[dev-dependencies]
http = { version = "1.5", default-features = false, features = ["std"] }
proptest = { version = "1.0", default-features = false, features = ["std"] }
tempfile = { version = "3", default-features = false, features = ["getrandom"] }
tokio-test = { version = "0.4", default-features = false }
# 炸弹 PDF 测试构造（FlateDecode 压缩炸弹样本，零新增供应链）
flate2 = "1"

[workspace.lints.rust]
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[lints]
workspace = true

[profile.release]
# 外部解析器防御式 catch_unwind 要求 panic = "unwind"（默认即 unwind，显式声明防止下游改 abort）
panic = "unwind"
