# pangu harness 元数据（生成来源记录）。生成物归本项目所有，pangu 不会自动覆盖。
# 模板升级：对照 https://github.com/Kirky-X/pangu 对应版本 tag 的 templates/ 手动 diff。
pangu_version: 0.1.10
generated_at: 2026-11-10T18:30:00Z
coverage_threshold: 89
threshold_profile: custom
default_branch: "main"
changelog: manual
release_workflow: enabled
codeql: enabled
harness_files:
  - .github/workflows/ci.yml
  - .github/workflows/release.yml
  - .github/workflows/codeql.yml
  - .github/dependabot.yml
  - .github/CODEOWNERS
  - .github/PULL_REQUEST_TEMPLATE.md
  - .github/ISSUE_TEMPLATE/bug.md
  - .github/ISSUE_TEMPLATE/feature.md
  - .github/ISSUE_TEMPLATE/question.md
  - .editorconfig
  - .pre-commit-config.yaml
  - deny.toml
  - rustfmt.toml
  - clippy.toml
  - .gitignore
