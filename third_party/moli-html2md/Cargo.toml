[package]
name = "moli-html2md"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Read-only DOM to Markdown conversion with an iterative state machine"
publish = false
rust-version = "1.97.1"

[dependencies]
icu_properties = { version = "2.3", default-features = false, features = ["compiled_data"] }

[dev-dependencies]
html5ever = "0.39"
markup5ever_rcdom = "0.39"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde_json = "1.0.145"
